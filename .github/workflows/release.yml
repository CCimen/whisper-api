# GitHub Actions Workflow: Build and Push Docker Images on Release
# Triggered when a tag matching v*.*.* is pushed

name: Docker Release

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.0.0, v1.2.3 etc.
  workflow_dispatch: # Allow manual triggering

env:
  # Use ghcr.io for GitHub Container Registry
  REGISTRY: ghcr.io
  # Image name will be derived from the repository name (e.g., ghcr.io/user/repo)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push images to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN has package write permission

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Generates tags like:
          # - ghcr.io/user/repo:latest (only on default branch release)
          # - ghcr.io/user/repo:v1.2.3 (from tag)
          # - ghcr.io/user/repo:1.2.3 (from tag)
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      # Build and push GPU image (default Dockerfile)
      - name: Build and push GPU Docker image
        id: build-push-gpu
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}-gpu # Add -gpu suffix
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64 # Assuming standard GPU build platform

      # Build and push CPU image (using build-arg)
      - name: Build and push CPU Docker image
        id: build-push-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}-cpu # Add -cpu suffix
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=python:3.10-slim # Override base image for CPU
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64 # Can add linux/arm64 if needed and base image supports it