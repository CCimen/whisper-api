# GitHub Actions Workflow: Continuous Integration
# Runs linters, type checkers, and tests on pushes/PRs to main branch

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual triggering

jobs:
  lint_test_typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"] # Match requires-python in pyproject.toml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: bash

    - name: Verify uv installation
      run: uv --version

    - name: Cache uv venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }} # Include lock file if committed
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies (including dev extras)
      run: uv pip install -e ".[dev,diarization]" # Install project in editable mode with dev and diarization extras

    - name: Lint with Ruff
      run: |
        uv run ruff format --check .
        uv run ruff check .

    - name: Type check with mypy
      run: uv run mypy .

    # Add pytest step once tests are available
    # - name: Test with pytest
    #   run: uv run pytest